[project]
name = "safe-twin-anyang-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.4",
  "requests==2.34.2",
  "pandas==2.3.3",
  "shapely==2.1.2",
  "pyproj==3.7.1",
  "networkx==3.4.2",
  "scikit-learn==1.6.1",
  "joblib==1.4.2"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["packages", "packages.contracts", "services", "services.api", "scripts", "scripts.data"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.27.2"]

[tool.pytest.ini_options]
markers = ["production_container: requires a running built production container"]
pythonpath = ["."]
testpaths = ["tests"]
